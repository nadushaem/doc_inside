[tool.ruff]
line-length = 100
target-version = "py312"   # минимальная версия для сервера (ubuntu 24.04); локально 3.13

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # сортировка импортов
    "B",             # типичные баги (bugbear)
    "UP",            # устаревший синтаксис
    "SIM",           # упрощения
    "RET",           # проблемы с return
    "BLE", "DTZ",    # голые except и datetime без tz
]
# BLE001: сбой одного врача/источника не должен ронять прогон — широкий except там намеренный
# DTZ005: datetime.now() без tz для логов и дат прогона допустим
ignore = ["BLE001", "DTZ005"]

[tool.ruff.lint.isort]
# модули из корня и sources/ — свои, а не сторонние пакеты
known-first-party = ["sources", "config", "storage", "ids", "dedupe", "merge"]

[tool.ruff.lint.per-file-ignores]
# даты отзывов на сайтах — местное время без таймзоны, храним их как есть
"sources/*/parser.py" = ["DTZ001"]
